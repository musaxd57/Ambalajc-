<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2447"/>
      <stop offset="100%" stop-color="#1a3a6b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Gold accent top bar -->
  <rect x="0" y="0" width="1200" height="5" fill="#c9a84c"/>

  <!-- Subtle corner decoration -->
  <rect x="80" y="80" width="60" height="3" fill="#c9a84c" opacity="0.6"/>
  <rect x="80" y="80" width="3" height="60" fill="#c9a84c" opacity="0.6"/>
  <rect x="1060" y="80" width="60" height="3" fill="#c9a84c" opacity="0.6"/>
  <rect x="1117" y="80" width="3" height="60" fill="#c9a84c" opacity="0.6"/>

  <!-- Brand name -->
  <text x="600" y="260"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="86"
        font-weight="700"
        fill="#ffffff"
        text-anchor="middle">İlliyyun</text>

  <text x="600" y="355"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="86"
        font-weight="700"
        fill="#c9a84c"
        text-anchor="middle">Ambalaj</text>

  <!-- Divider line -->
  <rect x="460" y="390" width="280" height="2" fill="#c9a84c" opacity="0.5"/>

  <!-- Tagline -->
  <text x="600" y="448"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#a8bfd4"
        text-anchor="middle"
        letter-spacing="3">KONAKLAMA SEKTÖRÜ TEDARİKÇİSİ</text>

  <!-- Website -->
  <text x="600" y="520"
        font-family="Arial, Helvetica, sans-serif"
        font-size="20"
        fill="#c9a84c"
        text-anchor="middle"
        opacity="0.9">illiyyunambalaj.com</text>
</svg>
